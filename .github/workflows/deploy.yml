name: Deploy

# Деплой на Cloudflare Workers після кожного push у main.
# Потрібні секрети репозиторію: CLOUDFLARE_API_TOKEN і CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions). Секрети самого Worker (пароль адмінки,
# ключі Supabase) задаються окремо командою `wrangler secret put` і тут не потрібні.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Пропуск, якщо секрети Cloudflare ще не додані
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Додайте CLOUDFLARE_API_TOKEN і CLOUDFLARE_ACCOUNT_ID у секрети репозиторію"
      - uses: actions/checkout@v7
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - uses: actions/setup-node@v7
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - run: npm run build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - run: npx wrangler deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      # IndexNow: повідомляємо Bing, Yandex та інші пошуковики про всі сторінки з sitemap.
      # Ключ публічний за задумом протоколу, файл лежить у public/cbd57934efbe2bdbf7cba4aa3b9b71fd.txt.
      - name: IndexNow
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        continue-on-error: true
        run: |
          sleep 20
          urls=$(curl -s https://stotesel.com.ua/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"stotesel.com.ua\",\"key\":\"cbd57934efbe2bdbf7cba4aa3b9b71fd\",\"keyLocation\":\"https://stotesel.com.ua/cbd57934efbe2bdbf7cba4aa3b9b71fd.txt\",\"urlList\":$urls}"
